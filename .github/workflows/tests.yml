# Ejecuta las pruebas en cada PR y en cada push a main.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: css/tailwind.css está actualizado
        run: |
          npm run build:css
          git diff --exit-code css/tailwind.css || (echo "::error::Ejecuta 'npm run build:css' y haz commit de css/tailwind.css" && exit 1)

      - name: Pruebas de lógica y datos
        run: npm test

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas en el navegador
        run: npm run test:e2e

      - name: Guardar informe si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: test-results/
          retention-days: 7
